<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pra você!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Troque 'fundo.jpg' pelo nome exato da sua imagem */
            background-image: url('IMG_20260703_102612.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: rgba(22, 27, 34, 0.85); /* Fundo semi-transparente */
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            width: 350px;
            text-align: center;
        }
        h2 { 
            color: #ff7b72; 
            margin-bottom: 1rem; 
        }
        p {
            color: #e6edf3;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Mensagem Especial ❤️</h2>
        <p>Eu te amo meu amor!</p>
    </div>

</body>
</html>
